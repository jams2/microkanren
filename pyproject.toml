[project]
name = "microkanren"
version = "0.4.4"
authors = [
    { name="Joshua Munn", email="public@elysee-munn.family" },
]
description = "A Python implementation of microkanren extended with constraints"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "pyrsistent >= 0.19, < 1",
    "fastcons == 0.5.0",
    "immutables >= 0.19, < 1",
]
license = {file = "LICENSE"}

[project.urls]
"Homepage" = "https://github.com/jams2/microkanren"
"Bug Tracker" = "https://github.com/jams2/microkanren/issues"

[project.optional-dependencies]
hy = [
    "hy>=1.0.0",
    "hyrule>=0.7.0",
]
dev = [
    "hatch == 1.7.0",
    "ruff>=0.7.1",
    "pyright>=1.1.377",
    "tox==4.11.3",
    "pytest==7.2.2",
    "debugpy>=1.8.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
minversion = 7.0
python_functions=[
    "test_*",
    "hyx_test_*",
]
filterwarnings = [
    "ignore:ast.NameConstant is deprecated:DeprecationWarning",
    "ignore:ast.Str is deprecated:DeprecationWarning",
    "ignore::pytest.PytestReturnNotNoneWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "S101",    # Use of `assert`
  "E501",    # line-too-long (conflicts with formatter)
  "W191",    # tab-indentation (conflicts with formatter)
]
select = [
  "B",       # flake8-bugbear
  "BLE",     # flake8-blind-except
  "PGH",     # pygrep-hooks
  "E",       # pycodestyle
  "F",       # pyflakes
  "UP",      # pyupgrade
  "I",       # isort
  "ARG",     # unused arguments
  "PT",      # pytest style
  "T10",     # flake8-debugger
  "C4",      # flake8-comprehensions
  "RUF100",  # unused-noqa
  "S",       # flake8-bandit
  "T20",     # flake8-print
  "W",       # pycodestyle warnings
  "YTT",     # flake8-2020
]
unfixable = [
  "ARG",     # unused arguments
]

[isort]
known-first-party = ["microkanren"]
lines-between-types = 1
lines-after-imports = 2

[tool.pyright]
pythonVersion = "3.12"
stubPath = ""
reportFunctionMemberAccess = "warning"

[tool.uv]
dev-dependencies = []
